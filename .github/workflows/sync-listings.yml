name: 同步永慶待售物件清單

on:
  schedule:
    # UTC 23:27 = 台灣時間隔天早上 07:27（要趕在 08:00 晨報前；避開整點，GitHub 整點很擠會延遲）
    - cron: "27 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取永慶房仲網物件清單
        run: node scripts/sync-listings.mjs

      - name: 抓取莎拉勾選的特色亮點與定稿金句
        run: node scripts/sync-appeal.mjs

      - name: 算各社區近 12 個月實價登錄成交筆數（內政部公開檔；失敗就保留舊檔）
        run: python3 scripts/sync-lvr-counts.py || echo "實價登錄這次沒算成，保留舊檔"

      - name: 店鋪封面避開格局圖（失敗就保留舊檔）
        run: |
          pip install --quiet pillow || true
          python3 scripts/pick-covers.py || echo "封面這次沒算成，保留舊檔"

      - name: 提交並推送(若有變更)
        run: |
          git config user.name "sala-listings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/listings.json src/data/appeal.json src/data/copy.json src/data/notes.json src/data/photo-manifest-sb.json src/data/archive.json src/data/archive-status.json src/data/sold.json src/data/community-stats.json src/data/lvr-counts.json src/data/cover-idx.json .sync-debug 2>/dev/null || git add src/data/listings.json src/data/appeal.json src/data/copy.json src/data/notes.json src/data/photo-manifest-sb.json src/data/archive.json src/data/archive-status.json src/data/sold.json src/data/community-stats.json src/data/lvr-counts.json src/data/cover-idx.json
          if git diff --staged --quiet; then
            echo "沒有變化,略過提交"
          else
            git commit -m "自動更新待售物件清單 $(date -u +'%Y-%m-%d')"
            git push
          fi
